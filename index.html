<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minha Hamburgueria</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

header {
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
}

.container {
    padding:15px;
}

.card {
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    box-shadow:0 2px 8px #ccc;
}

button {
    background:#e63946;
    color:white;
    border:0;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

.preco {
    font-weight:bold;
}

input {
    width:100%;
    padding:12px;
    margin:5px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

#listaCarrinho p {
    background:#eee;
    padding:8px;
    border-radius:6px;
}
</style>

</head>

<body>

<header>
<h1>🍔 Minha Hamburgueria</h1>
<p>Delivery rápido e saboroso</p>
</header>


<div class="container">


<h2>🍔 Hambúrgueres</h2>

<div class="card">
<h3>X-Bacon</h3>
<p class="preco">R$ 20,00</p>
<button onclick="adicionar('X-Bacon',20)">
Adicionar
</button>
</div>


<div class="card">
<h3>X-Salada</h3>
<p class="preco">R$ 18,00</p>
<button onclick="adicionar('X-Salada',18)">
Adicionar
</button>
</div>


<h2>🍕 Pizzas</h2>

<div class="card">
<h3>Pizza Calabresa</h3>
<p class="preco">R$ 35,00</p>
<button onclick="adicionar('Pizza Calabresa',35)">
Adicionar
</button>
</div>


<div class="card">
<h3>Pizza Frango</h3>
<p class="preco">R$ 38,00</p>
<button onclick="adicionar('Pizza Frango',38)">
Adicionar
</button>
</div>



<h2>🥤 Bebidas</h2>

<div class="card">
<h3>Coca-Cola 2L</h3>
<p class="preco">R$ 12,00</p>
<button onclick="adicionar('Coca-Cola 2L',12)">
Adicionar
</button>
</div>


<h2>🛒 Carrinho</h2>

<div class="card">

<div id="listaCarrinho">
Carrinho vazio
</div>

<h3>
Total: R$ <span id="total">0.00</span>
</h3>

</div>


<h2>📍 Dados do cliente</h2>

<div class="card">

<input id="nome" placeholder="Seu nome">

<input id="endereco" placeholder="Seu endereço">


<button onclick="finalizar()">
💬 Finalizar Pedido
</button>

</div>


</div>


<script>

let total = 0;
let carrinho = [];


function adicionar(nome, preco){

total += preco;

carrinho.push({
nome:nome,
preco:preco
});

mostrarCarrinho();

}



function mostrarCarrinho(){

let lista = document.getElementById("listaCarrinho");

lista.innerHTML="";


carrinho.forEach(item=>{

lista.innerHTML += `
<p>
🍔 ${item.nome} - R$ ${item.preco.toFixed(2)}
</p>
`;

});


document.getElementById("total").textContent =
total.toFixed(2);

}



function finalizar(){

let nome =
document.getElementById("nome").value;

let endereco =
document.getElementById("endereco").value;


let mensagem =
`🍔 *Pedido - Minha Hamburgueria*

👤 Cliente: ${nome}

📍 Endereço:
${endereco}


🛒 Pedido:
`;


carrinho.forEach(item=>{

mensagem +=
`\n🍔 ${item.nome} - R$ ${item.preco.toFixed(2)}`;

});


mensagem +=
`\n\n💰 Total: R$ ${total.toFixed(2)}`;



let numero="5587991532323";


let url =
"https://wa.me/"+numero+
"?text="+encodeURIComponent(mensagem);


window.location.href=url;


}


</script>


</body>
</html>
