<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Hamburgueria</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1a1a1a;
    color:white;
}

header{
    background:#ff9800;
    text-align:center;
    padding:20px;
}

#carrinho{
    position:fixed;
    top:10px;
    right:10px;
    background:#ff9800;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

.card{
    background:#2b2b2b;
    margin:15px;
    padding:15px;
    border-radius:12px;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
}
</style>
</head>

<body>

<div id="carrinho">
🛒 Itens: <span id="itens">0</span><br>
💰 Total: R$ <span id="total">0.00</span>
</div>

<header>
<h1>🍔 Minha Hamburgueria</h1>
<p>Os melhores hambúrgueres da cidade</p>
</header>

<div class="card">
<img src="hamburguer.jpg">

<h2>🍔 X-Burguer</h2>

<p>Pão, carne, queijo e salada.</p>

<h3>R$ 25,00</h3>

<button onclick="adicionar(25)">
Adicionar ao Carrinho
</button>
</div>

<div class="card">
<img src="hamburguer.jpg">

<h2>🥓 X-Bacon</h2>

<p>Carne, bacon e cheddar.</p>

<h3>R$ 32,00</h3>

<button onclick="adicionar(32)">
Adicionar ao Carrinho
</button>
</div>

<div class="card">
<img src="hamburguer.jpg">

<h2>🍔 X-Tudo</h2>

<p>Carne, bacon, ovo e cheddar.</p>

<h3>R$ 38,00</h3>

<button onclick="adicionar(38)">
Adicionar ao Carrinho
</button>
</div/>

<input
id="nome"
type="text"
placeholder="Seu nome"
style="width:100%;padding:12px;margin-top:10px;border-radius:8px;">

<input
id="endereco"
type="text"
placeholder="Endereço de entrega"
style="width:100%;padding:12px;margin-top:10px;border-radius:8px;">

<button onclick="finalizar()">
💬 Finalizar Pedido
</button>

<script>
let total = 0;
let itens = 0;

function adicionar(preco) {
    total += preco;
    itens++;

    document.getElementById("total").textContent = total.toFixed(2);
    document.getElementById("itens").textContent = itens;
}

function finalizar() {

    let mensagem =
`🍔 *Pedido - Minha Hamburgueria*

🛒 Itens: ${itens}
💰 Total: R$ ${total.toFixed(2)}
`;

    let numero = "5587991532323";

    let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem);

    window.location.href = url;
}
</script>

</body>
</html>

</body>
</html>
