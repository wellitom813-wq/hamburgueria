<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido</title>

<style>

    body{
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
}

h1, h2, h3, p, label{
    color:#fff;
}

input, select, textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    background:#111;
    color:#fff;
    border:1px solid #555;
    border-radius:10px;
}

input::placeholder{
    color:#aaa;
}

select option{
    background:#111;
    color:#fff;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    border-radius:30px;
    padding:15px;
    font-size:18px;
    font-weight:bold;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
}

header{
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
}

.container{

    max-width:500px;
    margin:20px auto;
    background:#111;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px #333;

}


input, textarea, select{

    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
    font-size:16px;

}


.pedido{
    background:#000;
    color:white;
    padding:15px;
    border-radius:10px;
    border:1px solid #333;
}


.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ccc;
    padding:10px 0;
}


.total{

    font-size:18px;
    font-weight:bold;
    margin-top:15px;

}


button{

    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#009900;
    color:white;
    font-size:18px;
    cursor:pointer;

}


.voltar{

    background:#111;

}

</style>

</head>


<body>


<header>

<h1>🍔 Finalizar Pedido</h1>

</header>



<div class="container">


<h2>Dados do cliente</h2>


<input id="nome" placeholder="Nome do cliente">


<input id="telefone" placeholder="WhatsApp">


<textarea id="endereco" placeholder="Endereço de entrega"></textarea>



<select id="bairro" onchange="calcularTaxa()">

<option value="">
Escolha a região
</option>

<option value="N1">
N1 - Taxa R$ 4,00
</option>

<option value="N3">
N3 - Taxa R$ 3,00
</option>

<option value="N5">
N5 - Taxa R$ 5,00
</option>

<option value="C2">
C2 - Taxa R$ 7,00
</option>

</select>



<select id="pagamento">

<option value="">
Forma de pagamento
</option>

<option>
Pix
</option>

<option>
Dinheiro
</option>

<option>
Cartão
</option>

    
</select>




<h2>🛒 Seu pedido</h2>


<div class="pedido">

<div id="listaPedido">

</div>


</div>



<div class="total">


Produtos:
<span id="valorProdutos">
R$ 0,00
</span>


<br>


Taxa entrega:
<span id="taxaEntrega">
R$ 0,00
</span>


<br><br>


Total:
<span id="valorTotal">
R$ 0,00
</span>


</div>

<p style="text-align:center;color:#16a34a;font-weight:bold;margin:15px 0;">
⏱️ Tempo estimado de entrega: 40 a 60 minutos.
</p>

<button onclick="enviarPedido()">

📲 Enviar pedido no WhatsApp

</button>



<button class="voltar" onclick="voltarCardapio()">

⬅ Voltar ao cardápio

</button>



</div>




<script>


let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];


let total = 0;

let taxa = 0;



let listaPedido = document.getElementById("listaPedido");



carrinho.forEach(item=>{


let subtotal = item.preco * item.quantidade;


total += subtotal;



listaPedido.innerHTML += `

<div class="item">

<div>
${item.quantidade}x ${item.nome}
<br>
R$ ${subtotal.toFixed(2)}
</div>

<button onclick="removerProduto(${carrinho.indexOf(item)})" 
style="
background:#dc2626;
padding:8px 12px;
font-size:14px;
border-radius:8px;
width:auto;
">
🗑️ Excluir
</button>

</div>

`;


});



document.getElementById("valorProdutos").innerHTML =

"R$ "+total.toFixed(2);



document.getElementById("valorTotal").innerHTML =

"R$ "+total.toFixed(2);


function removerProduto(index){

    carrinho.splice(index,1);

    localStorage.setItem("carrinho", JSON.stringify(carrinho));

    location.reload();

}


function calcularTaxa(){


let bairro = document.getElementById("bairro").value;



if(bairro=="N1"){

taxa=4;

}

else if(bairro=="N3"){

taxa=3;

}

else if(bairro=="N5"){

taxa=5;

}

else if(bairro=="C2"){

taxa=7;

}

else{

taxa=0;

}



document.getElementById("taxaEntrega").innerHTML =

"R$ "+taxa.toFixed(2);



document.getElementById("valorTotal").innerHTML =

"R$ "+(total+taxa).toFixed(2);



}


function verificarFuncionamento() {
    const agora = new Date();
    const hora = agora.getHours();

    if (hora >= 7 || hora < 1) {
        return true;
    }

    return false;
}

function enviarPedido() {

    if (!verificarFuncionamento()) {
        alert("🔴 Estamos fechados!\n\nHorário de funcionamento: 07:00 às 01:00.");
        return;
    }

let nome=document.getElementById("nome").value;

let telefone=document.getElementById("telefone").value;

let endereco=document.getElementById("endereco").value;

let bairro=document.getElementById("bairro").value;

let pagamento=document.getElementById("pagamento").value;



if(nome=="" || telefone=="" || endereco=="" || bairro=="" || pagamento==""){


alert("Preencha todos os campos!");

return;

}




let mensagem =
"═════【 *NOVO PEDIDO* 】═════\n\n" +

"► Nome:\n" +
nome + "\n\n" +

"► WhatsApp:\n" +
telefone + "\n\n" +

"► Endereço:\n" +
endereco + "\n\n" +

"► Região:\n" +
bairro + "\n\n" +

"► Pagamento:\n" +
pagamento + "\n\n" +

"═════【 *PEDIDO* 】═════\n\n";

carrinho.forEach(function(item){

    mensagem +=
    "► " + item.quantidade + "x " + item.nome + "\n" +
    "   R$ " + (item.preco * item.quantidade).toFixed(2).replace(".", ",") + "\n\n";

});

mensagem +=

"► Taxa de entrega:\n" +
"   R$ " + taxa.toFixed(2).replace(".", ",") + "\n\n" +

"► Total do pedido:\n" +
"   R$ " + (total + taxa).toFixed(2).replace(".", ",") + "\n\n" +

"════════════════════\n\n" +

"*Cantinho Pizza Burguer*\n\n" +

"Obrigado pela preferência!\n\n" +

"Seu pedido está sendo preparado.\n\n" +

"Esperamos atendê-lo novamente!";

let numero = "5587991532323";

window.open(
    "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem),
    "_blank"
);

    }

function voltarCardapio(){

    localStorage.setItem("carrinho", JSON.stringify(carrinho));

    window.location.href="index.html";

}



</script>


</body>

</html>
