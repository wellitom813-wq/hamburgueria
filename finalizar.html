<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido</title>

<style>

body{

font-family:Arial,sans-serif;

background:#f5f5f5;

margin:0;

padding:15px;

}

.box{

background:white;

padding:20px;

border-radius:15px;

max-width:600px;

margin:auto;

box-shadow:0 2px 10px rgba(0,0,0,.2);

}

h1{

text-align:center;

}

.item{

border-bottom:1px solid #ddd;

padding:10px 0;

}

input,select{

width:100%;

padding:12px;

margin-top:10px;

margin-bottom:15px;

border:1px solid #ccc;

border-radius:8px;

box-sizing:border-box;

}

button{

width:100%;

padding:15px;

background:#25D366;

color:white;

border:none;

border-radius:10px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

button:hover{

background:#1fa851;

}

.total{

font-size:20px;

font-weight:bold;

margin-top:15px;

}

</style>

</head>

<body>

<div class="box">

<h1>Finalizar Pedido</h1>

<div id="pedido"></div>

<p class="total">
Subtotal: R$
<span id="total">0.00</span>
</p>

<label>Nome</label>

<input
id="nome"
placeholder="Seu nome">

<label>Bairro</label>

<select
id="bairro"
onchange="calcularFrete()">

<option value="">Selecione o bairro</option>

<option value="Centro">Centro</option>

<option value="Projeto N1">Projeto N1</option>

<option value="Projeto N2">Projeto N2</option>

<option value="Projeto N3">Projeto N3</option>

<option value="Projeto N4">Projeto N4</option>

<option value="Projeto N5">Projeto N5</option>

<option value="Cohab">Cohab</option>

</select>

<label>Rua e número</label>

<input
id="endereco"
placeholder="Rua e número">

<p>

Taxa de entrega:
R$
<span id="valorFrete">0.00</span>

</p>

<p class="total">

Total:
R$
<span id="totalFinal">0.00</span>

</p>

<label>Forma de pagamento</label>

<select id="pagamento">

<option>Pix</option>

<option>Dinheiro</option>

<option>Cartão</option>

</select>

<button onclick="enviarWhatsApp()">

Enviar Pedido

</button>

</div>

    <script>

let carrinho =
JSON.parse(localStorage.getItem("carrinho")) || [];

let total = 0;

let taxa = 0;

function calcularFrete(){

let bairro =
document.getElementById("bairro").value;

switch(bairro){

case "Centro":
taxa = 3;
break;

case "Projeto N1":
taxa = 3;
break;

case "Projeto N2":
taxa = 4;
break;

case "Projeto N3":
taxa = 5;
break;

case "Projeto N4":
taxa = 6;
break;

case "Projeto N5":
taxa = 7;
break;

case "Cohab":
taxa = 8;
break;

default:
taxa = 0;

}

document.getElementById("valorFrete").innerText =
taxa.toFixed(2);

document.getElementById("totalFinal").innerText =
(total + taxa).toFixed(2);

}

function carregarPedido(){

let lista =
document.getElementById("pedido");

lista.innerHTML = "";

total = 0;

carrinho.forEach(item=>{

let subtotal =
item.preco * item.quantidade;

total += subtotal;

lista.innerHTML += `

<div class="item">

<b>${item.nome}</b>

<br>

Quantidade: ${item.quantidade}

<br>

Valor: R$ ${subtotal.toFixed(2)}

</div>

`;

});

document.getElementById("total").innerText =
total.toFixed(2);

document.getElementById("totalFinal").innerText =
(total + taxa).toFixed(2);

}

        function enviarWhatsApp(){

let nome =
document.getElementById("nome").value;

let bairro =
document.getElementById("bairro").value;

let endereco =
document.getElementById("endereco").value;

let pagamento =
document.getElementById("pagamento").value;

if(nome.trim()==""){

alert("Digite seu nome");
return;

}

if(bairro==""){

alert("Selecione seu bairro");
return;

}

if(endereco.trim()==""){

alert("Digite sua rua e número");
return;

}

let mensagem =

`================================

CANTINHO PIZZA BURGUER

================================

NOVO PEDIDO

Cliente:
${nome}

Bairro:
${bairro}

Endereço:
${endereco}

--------------------------------

ITENS DO PEDIDO

--------------------------------

`;

carrinho.forEach(item=>{

let subtotal =
item.preco * item.quantidade;

mensagem +=

`${item.nome}

Quantidade: ${item.quantidade}

Valor: R$ ${subtotal.toFixed(2)}

`;

});

mensagem +=

`--------------------------------

Taxa de entrega:
R$ ${taxa.toFixed(2)}

TOTAL:
R$ ${(total+taxa).toFixed(2)}

Pagamento:
${pagamento}

================================

Obrigado pela preferência!

================================`;

let numero =
"5587981670907";

let url =
"https://wa.me/"+numero+
"?text="+encodeURIComponent(mensagem);

window.location.href=url;

}

carregarPedido();

</script>

</body>

</html>
