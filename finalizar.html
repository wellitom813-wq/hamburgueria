<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
}

.container{

    max-width:500px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px #ccc;

}


input, textarea, select{

    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
    font-size:16px;

}


.pedido{

    background:#eee;
    padding:15px;
    border-radius:10px;

}


.item{

    border-bottom:1px solid #ccc;
    padding:8px 0;

}


.total{

    font-size:18px;
    font-weight:bold;
    margin-top:15px;

}


button{

    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#009900;
    color:white;
    font-size:18px;
    cursor:pointer;

}


.voltar{

    background:#111;

}

</style>

</head>


<body>


<header>

<h1>🍔 Finalizar Pedido</h1>

</header>



<div class="container">


<h2>Dados do cliente</h2>


<input id="nome" placeholder="Nome do cliente">


<input id="telefone" placeholder="WhatsApp">


<textarea id="endereco" placeholder="Endereço de entrega"></textarea>



<select id="bairro" onchange="calcularTaxa()">

<option value="">
Escolha a região
</option>

<option value="N1">
N1 - Taxa R$ 4,00
</option>

<option value="N3">
N3 - Taxa R$ 3,00
</option>

<option value="N5">
N5 - Taxa R$ 5,00
</option>

<option value="C2">
C2 - Taxa R$ 7,00
</option>

</select>



<select id="pagamento">

<option value="">
Forma de pagamento
</option>

<option>
Pix
</option>

<option>
Dinheiro
</option>

<option>
Cartão
</option>

</select>




<h2>🛒 Seu pedido</h2>


<div class="pedido">

<div id="listaPedido">

</div>


</div>



<div class="total">


Produtos:
<span id="valorProdutos">
R$ 0,00
</span>


<br>


Taxa entrega:
<span id="taxaEntrega">
R$ 0,00
</span>


<br><br>


Total:
<span id="valorTotal">
R$ 0,00
</span>


</div>

<p style="text-align:center;color:#16a34a;font-weight:bold;margin:15px 0;">
⏱️ Tempo estimado de entrega: 40 a 60 minutos.
</p>

<button onclick="enviarPedido()">

📲 Enviar pedido no WhatsApp

</button>



<button class="voltar" onclick="voltarCardapio()">

⬅ Voltar ao cardápio

</button>



</div>




<script>


let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];


let total = 0;

let taxa = 0;



let listaPedido = document.getElementById("listaPedido");



carrinho.forEach(item=>{


let subtotal = item.preco * item.quantidade;


total += subtotal;



listaPedido.innerHTML += `

<div class="item">

${item.quantidade}x ${item.nome}

<br>

R$ ${subtotal.toFixed(2)}

</div>

`;


});



document.getElementById("valorProdutos").innerHTML =

"R$ "+total.toFixed(2);



document.getElementById("valorTotal").innerHTML =

"R$ "+total.toFixed(2);





function calcularTaxa(){


let bairro = document.getElementById("bairro").value;



if(bairro=="N1"){

taxa=4;

}

else if(bairro=="N3"){

taxa=3;

}

else if(bairro=="N5"){

taxa=5;

}

else if(bairro=="C2"){

taxa=7;

}

else{

taxa=0;

}



document.getElementById("taxaEntrega").innerHTML =

"R$ "+taxa.toFixed(2);



document.getElementById("valorTotal").innerHTML =

"R$ "+(total+taxa).toFixed(2);



}


function verificarFuncionamento() {
    const agora = new Date();
    const hora = agora.getHours();

    if (hora >= 7 && hora < 22) {
        return true;
    }

    return false;
}

function enviarPedido() {

    if (!verificarFuncionamento()) {
        alert("🔴 Estamos fechados!\n\nHorário de funcionamento: 07:00 às 22:00.");
        return;
    }

let nome=document.getElementById("nome").value;

let telefone=document.getElementById("telefone").value;

let endereco=document.getElementById("endereco").value;

let bairro=document.getElementById("bairro").value;

let pagamento=document.getElementById("pagamento").value;



if(nome=="" || telefone=="" || endereco=="" || bairro=="" || pagamento==""){


alert("Preencha todos os campos!");

return;

}




let mensagem =

"🍔 *NOVO PEDIDO*%0A%0A"+

"👤 Nome: "+nome+"%0A"+

"📱 WhatsApp: "+telefone+"%0A"+

"📍 Endereço: "+endereco+"%0A"+

"🏠 Região: "+bairro+"%0A"+

"💳 Pagamento: "+pagamento+"%0A%0A"+

"🛒 Pedido:%0A";




carrinho.forEach(item=>{


mensagem +=

item.quantidade+"x "+item.nome+

" - R$ "+

(item.preco*item.quantidade).toFixed(2)

+"%0A";


});



mensagem +=

"%0A🚚 Taxa entrega: R$ "+taxa.toFixed(2)+

"%0A💰 Total: R$ "+(total+taxa).toFixed(2)+
"%0A%0A";


mensagem +=
"%0A%0A━━━━━━━━━━━━━━"+
"%0A🍕 Cantinho Pizza Burguer"+
"%0A%0AObrigado pela preferência!"+
"%0A%0ASeu pedido está sendo preparado. Em breve ele chegará até você."+
"%0A%0A💚 Esperamos atendê-lo novamente!";


let numero="5587991532323";



window.open(

"https://wa.me/"+numero+"?text="+mensagem,

"_blank"

);



}




function voltarCardapio(){

window.location.href="index.html";

}



</script>


</body>

</html>
